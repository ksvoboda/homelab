apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
spec:
  template:
    spec:
      containers:
      - name: jellyfin
        image: jellyfin/jellyfin:latest
        volumeMounts:
        - name: config-storage
          mountPath: /config
        - name: media-storage
          mountPath: /media
      volumes:
      - name: config-storage
        persistentVolumeClaim:
          claimName: jellyfin-config-pvc
      - name: media-storage
        persistentVolumeClaim:
          claimName: jellyfin-media-pvc
