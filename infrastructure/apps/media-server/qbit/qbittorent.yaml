apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media
  labels:
    app: qbittorrent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      containers:
      # --- Gluetun Sidecar ---
      - name: gluetun
        image: qmcgaw/gluetun:latest
        securityContext:
          capabilities:
            add:
              - NET_ADMIN # Required for VPN tunnel and firewall rules
        env:
        - name: FIREWALL_INPUT_PORTS
          value: "8080" # Allows access to the Web UI within the pod
        - name: FIREWALL_OUTBOUND_SUBNETS
          value: "10.42.0.0/16" # Essential for internal k3s service discovery
        - name: WIREGUARD_MTU
          value: "1280"
        - name: VPN_SERVICE_PROVIDER
          value: "protonvpn"
        - name: VPN_TYPE
          value: "wireguard"
        - name: WIREGUARD_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: vpn-creds
              key: wireguard_private_key
        - name: SERVER_COUNTRIES
          value: "Netherlands"
        ports:
        - containerPort: 8080
          name: http-webui
        volumeMounts:
        - mountPath: /dev/net/tun
          name: tun-device
      # --- qBittorrent ---
      - name: qbittorrent
        image: lscr.io/linuxserver/qbittorrent:latest
        env:
          - name: WEBUI_PORT
            value: "8080"
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /media
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: qbittorrent-config
      - name: media
        persistentVolumeClaim:
          claimName: jellyfin-media-pvc
      - name: tun-device
        hostPath:
          path: /dev/net/tun