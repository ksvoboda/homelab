apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: media
spec:
  replicas: 0
  selector:
    matchLabels:
      app: seerr
  template:
    metadata:
      labels:
        app: seerr
    spec:
      securityContext:
        fsGroup: 1000 
      containers:
      - name: seerr
        image: seerr/seerr:latest
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        ports:
        - containerPort: 8989
        volumeMounts:
        - name: config
          mountPath: /app/config
        - name: media
          mountPath: /media
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: seerr-config
      - name: media
        persistentVolumeClaim:
          claimName: jellyfin-media-pvc # Shared SMB PVC
