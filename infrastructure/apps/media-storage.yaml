apiVersion: v1
kind: Secret
metadata:
  name: smb-creds
  namespace: media
stringData:
  username: "media_server"
  password: "7tQsSH8V^f&^C&"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: smb-media-pv
spec:
  capacity:
    storage: 2Ti
  accessModes: ["ReadWriteMany"]
  persistentVolumeReclaimPolicy: Retain
  mountOptions: ["dir_mode=0777", "file_mode=0777", "noperm"]
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: media-share-unique-id
    volumeAttributes:
      source: "//192.168.0.82/jellyfin" # UPDATE THIS
    nodeStageSecretRef:
      name: smb-creds
      namespace: media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-pvc
  namespace: media
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 2Ti
  volumeName: smb-media-pv
  storageClassName: ""
