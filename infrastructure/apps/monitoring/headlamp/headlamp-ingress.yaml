apiVersion: v1
kind: Service
metadata:
  name: headlamp-svc
  namespace: monitoring
spec:
  selector:
    app: headlamp
  ports:
  - port: 80
    targetPort: 4466
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp-ingress
  namespace: monitoring
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
  - host: headlamp.lab
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: headlamp-svc
            port:
              number: 80