apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: intel-gpu-plugin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://intel.github.io/helm-charts/'
    chart: intel-device-plugin-gpu
    targetRevision: gpu-0.36.0
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
