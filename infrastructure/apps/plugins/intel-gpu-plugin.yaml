apiVersion: apps/v1
kind: Application
metadata:
  name: intel-gpu-plugin
  namespace: plugins
spec:
  project: default
  source:
    chart: intel-device-plugins-gpu-plugin
    repoURL: https://intel.github.io/helm-charts/
    helm:
      values: |
        nodeSelector:
          intel.feature.node.kubernetes.io/gpu: 'true'
        sharedDevNum: 5
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    createNamespace: true