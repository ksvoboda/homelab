apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media-server
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ksvoboda/homelab
    targetRevision: HEAD
    path: infrastructure/apps/media-server 
    directory:
      recurse: true  
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd      
  syncPolicy:
    automated:              
      prune: true          
      selfHeal: true       
    syncOptions:
      - CreateNamespace=true 
