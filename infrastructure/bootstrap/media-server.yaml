apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media-server
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ksvoboda/homelab
    targetRevision: HEAD
    path: infrastructure/apps/media-server 
    directory:
      recurse: true  
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd      
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true # Crucial: Enforces the rules below

  # This tells ArgoCD to completely ignore the extra settings injected by the Intel Operator
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: jellyfin
      namespace: media
      jsonPathExpressions:
        # Ignores the environment variables injected by the Intel webhook
        - .spec.template.spec.containers[*].env
        - .spec.template.spec.containers[*].resources
        # Ignores the driver storage volumes injected by the Intel webhook
        - .spec.template.spec.containers[*].volumeMounts
        - .spec.template.spec.volumes