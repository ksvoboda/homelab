apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media-server
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ksvoboda/homelab
    targetRevision: HEAD
    path: infrastructure/apps/media-server 
    directory:
      recurse: true  
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd      
  syncPolicy:
    automated:              
      prune: true          
      selfHeal: true       
    syncOptions:
      - CreateNamespace=true 
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        # Prevents ArgoCD from drifting over string vs integer formatting differences
        - /spec/template/spec/containers/0/resources/requests/gpu.intel.com~1i915
        - /spec/template/spec/containers/0/resources/limits/gpu.intel.com~1i915
