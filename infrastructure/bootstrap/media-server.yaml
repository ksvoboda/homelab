apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media-server
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ksvoboda/homelab
    targetRevision: HEAD
    path: infrastructure/apps/media-server 
    directory:
      recurse: true  
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd      
  syncPolicy:
    automated:              
      prune: true          
      selfHeal: true       
    syncOptions:
      - CreateNamespace=true 
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: jellyfin
      namespace: media-server
      jsonPathExpressions:
        - .spec.template.spec.containers[*].resources.requests["://intel.com"]
        - .spec.template.spec.containers[*].resources.limits["://intel.com"]

