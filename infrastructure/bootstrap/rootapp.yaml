apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ksvoboda/homelab
    targetRevision: HEAD
    path: infrastructure/apps/             # This is the folder where your longhorn.yaml, etc. live
    directory:
      recurse: true         # Optional: looks into subfolders within 'apps/'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd       # The root app itself lives in the argocd namespace
  syncPolicy:
    automated:              # This enables the "Auto Sync" you asked for
      prune: true           # Deletes apps from K8s if you delete their file from Git
      selfHeal: true        # Fixes apps if someone manually edits them via kubectl
    syncOptions:
      - CreateNamespace=true # Useful if your child apps need new namespaces
